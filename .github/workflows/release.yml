name: Release Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - refs/tags/*
      - Release-pipeline   

permissions:
  checks: write
  pull-requests: write
  id-token: write
  contents: read

jobs:
  package:
    uses: ./.github/workflows/package.yml
    secrets: inherit
  release:
    needs: [package] 
    uses: ./.github/workflows/deploy.yml
    with:
        environment: Sandbox       
    secrets: inherit
     

