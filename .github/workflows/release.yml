name: Release Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - refs/tags/*
      - Release-pipeline   

permissions:
  checks: write
  pull-requests: write
  id-token: write
  contents: read

jobs:
  package:
    uses: ./.github/workflows/package.yml
    secrets: inherit
  release:
    needs: [package] 
    uses: ./.github/workflows/deploy.yml
    with:
        environment: Sandbox       
    secrets: inherit
  #test1
  github-release:
    needs: [package]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: artifacts
          merge-multiple: true

      - name: Download scripts artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: scripts-*
          path: artifacts
          merge-multiple: true

      - name: Edit GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/*.zip
     

