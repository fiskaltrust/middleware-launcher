name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true      

permissions:
  id-token: write
  contents: read

jobs:
  packages:
    name: Deploy Packages
    strategy:
      matrix:
        include:
          - vmImage: windows-latest
            target: win-x64
            scriptFolder: "windows"

          - vmImage: windows-latest
            target: win-x86
            scriptFolder: "windows"

          - vmImage: ubuntu-latest
            target: linux-x64
            scriptFolder: "linux"

          - vmImage: ubuntu-latest
            target: linux-arm
            scriptFolder: "linux"

          - vmImage: ubuntu-latest
            target: linux-arm64
            scriptFolder: "linux"

          - vmImage: macos-latest
            target: osx-x64
            scriptFolder: "macos"
    runs-on: ${{ matrix.vmImage }}
    needs: []
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Download zip Package
        uses: actions/download-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: artifacts/package-${{ matrix.target }}

      - name: Download scripts Package
        uses: actions/download-artifact@v4
        with:
          name: scripts-${{ matrix.target }}
          path: artifacts/scripts-${{ matrix.target }}

      - name: Rename Package Artifacts
        shell: pwsh
        run: |
            Get-ChildItem "artifacts/package-${{ matrix.target }}/package-*/*" | ForEach-Object { Rename-Item $_ $_.Name.Replace("fiskaltrust.Launcher-", "") }
            Get-ChildItem "artifacts/scripts-${{ matrix.target }}/scripts-*/*" | ForEach-Object { Rename-Item $_ $_.Name.Replace("fiskaltrust.Launcher.Scripts-", "") }
      
      - name: Deploy zip Packages
        uses: ./.github/actions/deploy-packages
        #fiskaltrust/middleware/.github/actions/deploy-v2-packages@main
        with:
          directory: artifacts/package-${{ matrix.target }}
          storageAccountName: stdevwesteuropepackages
          clientId: ${{ secrets.AZURE_CLIENT_ID }}
          tenantId: ${{ secrets.AZURE_TENANT_ID }}
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          target: ${{ matrix.target }}

      - name: Deploy Script Packages
        uses: ./.github/actions/deploy-packages
        #fiskaltrust/middleware/.github/actions/deploy-v2-packages@main
        with:
          directory: artifacts/scripts-${{ matrix.target }}
          storageAccountName: stdevwesteuropepackages
          clientId: ${{ secrets.AZURE_CLIENT_ID }}
          tenantId: ${{ secrets.AZURE_TENANT_ID }}
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          target: ${{ matrix.target }}
         
         