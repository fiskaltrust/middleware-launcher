name: Test Launcher

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      commit:
        type: string
        required: false

jobs:
  test:
    strategy:
      matrix:
        vmImage: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.vmImage }}
    name: test-${{ matrix.vmImage }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: build
        uses: fiskaltrust/middleware/.github/actions/build@main
        with:
          pattern: fiskaltrust.Launcher.sln
          configuration: Debug

      - name: Unit Tests
        uses: fiskaltrust/middleware/.github/actions/test@main
        with:
          directory: test
          pattern: "UnitTest"
          args: '--no-build'
          artifactName: "UnitTest-${{ matrix.vmImage }}.test-results"

      - name: Integration Tests
        uses: fiskaltrust/middleware/.github/actions/test@main
        with:
          directory: test
          pattern: "IntegrationTest"
          args: '--no-build'
          artifactName: "IntegrationTest-${{ matrix.vmImage }}.test-results"

  publish-test-results:
    name: Publish Tests Results
    needs: test
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    if: always()

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Launcher Test Results
          comment_mode: always
          files: "artifacts/**/*.trx"
          commit: ${{ inputs.commit }}
