name: Github Release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: artifacts
          merge-multiple: true

      - name: Download scripts artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: scripts-*
          path: artifacts
          merge-multiple: true

      - name: Edit GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/*.zip
