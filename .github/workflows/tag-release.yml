name: Tag Release

on:
  workflow_dispatch:

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A PAT is required (instead of the default GITHUB_TOKEN) so that
          # pushing the tag triggers the Release Launcher workflow.
          token: ${{ secrets.REPOSITORY_WRITE_PAT }}

      - name: Install Nerdbank.GitVersioning
        shell: pwsh
        run: |
          $version = "3.10.94"
          $installed = dotnet tool list --global | Select-String -Pattern '^\s*nbgv\s'
          if ($installed) {
            dotnet tool update --global nbgv --version $version
          } else {
            dotnet tool install --global nbgv --version $version
          }

      - name: Create and push tag
        shell: pwsh
        run: |
          $tag = nbgv tag --project src/fiskaltrust.Launcher --what-if
          Write-Host "Creating tag: $tag"

          git config user.name "ReleaseBot"
          git config user.email "dev-portal-poscreator@fiskaltrust.de"
          nbgv tag --project src/fiskaltrust.Launcher
          git push origin $tag
